<h2 class="section-heading">Personal Details</h2>
<div class="tint avoid-break">
  <div class="card">
    <div class="card-row">
      <div class="card-cell">
        <span class="detail-label">Name</span>
        <span class="detail-value">{{ consumer.name }}</span>
      </div>
      <div class="card-cell">
        <span class="detail-label">Date Of Birth</span>
        <span class="detail-value">{{ consumer.date_of_birth }}</span>
      </div>
      <div class="card-cell">
        <span class="detail-label">Gender</span>
        <span class="detail-value">{{ consumer.gender }}</span>
      </div>
    </div>
  </div>
</div>
